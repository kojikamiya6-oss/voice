<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ボイスチェンジャー</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eeecff;--card:#fff;--ink:#1d1a3d;--sub:#6b6896;--line:#d9d5f5;--accent:#ff4f8b;--accent-ink:#fff;--track:#d9d5f5;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14122b;--card:#1f1c40;--ink:#f1efff;--sub:#a29fd0;--line:#363268;--accent:#ff6b9f;--accent-ink:#1d1a3d;--track:#363268}
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.6}
main{max-width:460px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.35rem;margin:4px 0 2px;font-weight:800}
.lead{color:var(--sub);font-size:.85rem;margin:0 0 18px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px 18px;text-align:center}
#power{width:132px;height:132px;border-radius:50%;border:0;background:var(--track);color:var(--ink);font-size:1rem;font-weight:800;cursor:pointer}
#power[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.meter{height:10px;border-radius:6px;background:var(--track);margin:20px 6px 6px;overflow:hidden}
#level{height:100%;width:0;background:var(--accent);border-radius:6px}
#status{font-size:.85rem;color:var(--sub);margin:8px 0 0;min-height:1.4em}
.warn{font-size:.8rem;color:var(--sub);margin:14px 4px 0}
h2{font-size:.95rem;margin:24px 2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;font-size:.9rem;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:10px}
.row label{display:flex;justify-content:space-between;font-size:.9rem;font-weight:600}
.row output{color:var(--sub);font-weight:500}
input[type=range]{width:100%;margin:10px 0 2px;accent-color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>ボイスチェンジャー</h1>
  <p class="lead">マイクの声をその場で変えます。音声はこの端末の中だけで処理され、送信されません。</p>
  <section class="stage">
    <button id="power" type="button" aria-pressed="false">スタート</button>
    <div class="meter" aria-hidden="true"><div id="level"></div></div>
    <p id="status" role="status">ボタンを押してマイクを許可してください</p>
    <p class="warn">ハウリング防止のため、イヤホンまたはヘッドホンを使ってください。</p>
  </section>
  <h2>プリセット</h2>
  <div class="chips" id="chips"></div>
  <h2>細かく調整</h2>
  <div class="row"><label for="pitch">ピッチ <output id="o-pitch"></output></label><input id="pitch" type="range" min="-12" max="12" step="0.5" value="0"></div>
  <div class="row"><label for="robot">ロボット <output id="o-robot"></output></label><input id="robot" type="range" min="0" max="100" value="0"></div>
  <div class="row"><label for="echo">エコー <output id="o-echo"></output></label><input id="echo" type="range" min="0" max="100" value="0"></div>
  <div class="row"><label for="vol">音量 <output id="o-vol"></output></label><input id="vol" type="range" min="0" max="150" value="100"></div>
</main>
<script>
const P = {pitch:0, robot:0, echo:0, vol:100};
const presets = [
  {n:"通常", pitch:0, robot:0, echo:0},
  {n:"高い声", pitch:5, robot:0, echo:0},
  {n:"低い声", pitch:-5, robot:0, echo:0},
  {n:"ヘリウム", pitch:9, robot:0, echo:0},
  {n:"悪魔", pitch:-9, robot:30, echo:35},
  {n:"ロボット", pitch:0, robot:90, echo:0},
  {n:"山びこ", pitch:0, robot:0, echo:65}
];
const $ = id => document.getElementById(id);
const sl = {pitch:$("pitch"), robot:$("robot"), echo:$("echo"), vol:$("vol")};
const fmt = {pitch:v=>(v>0?"+":"")+v+" 半音", robot:v=>v+"%", echo:v=>v+"%", vol:v=>v+"%"};
let ctx, stream, src, proc, delay, fb, wet, master, analyser, raf, running = false;
function syncUI(){
  for (const k in sl){ sl[k].value = P[k]; $("o-"+k).textContent = fmt[k](P[k]); }
  applyEcho();
}
function applyEcho(){
  if (!ctx) return;
  const e = P.echo/100;
  wet.gain.value = e*0.8;
  fb.gain.value = Math.min(0.65, e*0.6);
  master.gain.value = P.vol/100;
}
for (const k in sl){
  sl[k].addEventListener("input", () => {
    P[k] = parseFloat(sl[k].value);
    $("o-"+k).textContent = fmt[k](P[k]);
    markPreset(null); applyEcho();
  });
}
const chipEls = presets.map(p => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = p.n; b.setAttribute("aria-pressed","false");
  b.onclick = () => { P.pitch=p.pitch; P.robot=p.robot; P.echo=p.echo; syncUI(); markPreset(b); };
  $("chips").appendChild(b); return b;
});
function markPreset(el){ chipEls.forEach(c => c.setAttribute("aria-pressed", String(c===el))); }
markPreset(chipEls[0]); syncUI();

function makeProcessor(ac){
  const sr = ac.sampleRate, N = 1 << 16, mask = N - 1;
  const W = Math.floor(sr * 0.05);
  const buf = new Float32Array(N);
  let wp = 0, phase = 0, t = 0;
  const node = ac.createScriptProcessor(1024, 1, 1);
  node.onaudioprocess = e => {
    const inp = e.inputBuffer.getChannelData(0), out = e.outputBuffer.getChannelData(0);
    const ratio = Math.pow(2, P.pitch/12);
    const step = (1 - ratio) / W;
    const rd = P.robot/100, w = 2*Math.PI*45/sr;
    for (let i = 0; i < inp.length; i++){
      buf[wp & mask] = inp[i];
      let y;
      if (P.pitch === 0){ y = inp[i]; }
      else {
        const p2 = (phase + 0.5) % 1;
        y = tap(phase)*(1-Math.abs(2*phase-1)) + tap(p2)*(1-Math.abs(2*p2-1));
        phase += step; if (phase < 0) phase += 1; else if (phase >= 1) phase -= 1;
      }
      if (rd > 0){ y *= (1-rd) + rd*Math.sin(w*t); }
      t++; wp++;
      out[i] = y;
    }
    function tap(p){
      const d = p*W + 2, pos = wp - d, i0 = Math.floor(pos), f = pos - i0;
      return buf[i0 & mask]*(1-f) + buf[(i0+1) & mask]*f;
    }
  };
  return node;
}

async function start(){
  $("status").textContent = "マイクを準備中…";
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:false, autoGainControl:false}});
  }catch(err){
    $("status").textContent = "マイクを使えません。ブラウザの設定でマイクを許可してください。";
    return;
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)({latencyHint:"interactive"});
  await ctx.resume();
  src = ctx.createMediaStreamSource(stream);
  proc = makeProcessor(ctx);
  delay = ctx.createDelay(1); delay.delayTime.value = 0.28;
  fb = ctx.createGain(); wet = ctx.createGain(); master = ctx.createGain();
  const comp = ctx.createDynamicsCompressor();
  analyser = ctx.createAnalyser(); analyser.fftSize = 512;
  src.connect(proc);
  proc.connect(master);
  proc.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
  master.connect(comp); comp.connect(ctx.destination); comp.connect(analyser);
  applyEcho();
  running = true;
  $("power").setAttribute("aria-pressed","true"); $("power").textContent = "ストップ";
  $("status").textContent = "変換中。話してみましょう。";
  const data = new Uint8Array(analyser.fftSize);
  (function loop(){
    analyser.getByteTimeDomainData(data);
    let m = 0; for (const v of data) m = Math.max(m, Math.abs(v-128));
    $("level").style.width = Math.min(100, m/128*160) + "%";
    raf = requestAnimationFrame(loop);
  })();
}
function stop(){
  running = false; cancelAnimationFrame(raf);
  if (proc) proc.onaudioprocess = null;
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (ctx) ctx.close();
  ctx = null;
  $("level").style.width = "0";
  $("power").setAttribute("aria-pressed","false"); $("power").textContent = "スタート";
  $("status").textContent = "停止中";
}
$("power").onclick = () => running ? stop() : start();
</script>
</body>
</html>
